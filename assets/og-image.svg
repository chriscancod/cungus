<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- OLD-MONEY PASS (2026-09-03): repainted from the 2026-08-23 black/red/white
       "dark-luxury" palette to the new cream/hunter-green/brass system, per
       Chris's explicit call. Same discipline as the 2026-08-30 fix this replaces:
       checked shared/base.css directly rather than guessing, and kept the mark's
       circle/path geometry identical to the live nav logo (now hunter green with
       a brass star instead of solid red) so the share card stays pixel-consistent
       with the real logo. Wordmark switched from Arial Black to a serif to match
       the site's new Cormorant Garamond/EB Garamond type system — SVG text can't
       load a web font reliably in social-crawler renderers, so it uses Georgia/
       Times as the safe serif fallback stack instead of naming the web font. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#efe4d0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f4ede0" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#f4ede0"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="rgba(46,74,53,0.18)" stroke-width="2"/>

  <!-- brand mark: same circle/star geometry as the live nav logo, scaled up -->
  <g transform="translate(600,205)">
    <circle cx="0" cy="0" r="72" fill="#ece1c8" stroke="rgba(46,74,53,0.35)" stroke-width="1.5"/>
    <g transform="scale(1.6) translate(-53,-49)">
      <circle cx="44" cy="52" r="26" fill="#2e4a35"/>
      <circle cx="56" cy="44" r="22" fill="#ece1c8"/>
      <path d="M78 20L81 27L88 30L81 33L78 40L75 33L68 30L75 27Z" fill="#a8894f"/>
    </g>
  </g>

  <text x="600" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="112" letter-spacing="14" fill="#2a2419">2AM</text>
  <text x="600" y="410" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="26" fill="rgba(42,36,25,0.55)">Built for the hours no one sees</text>

  <text x="600" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="6" fill="rgba(168,137,79,0.9)">2AMCASES.ONLINE</text>
</svg>
