<!DOCTYPE html>
<!-- Last edited: 2026-09-03 11:12 PM EDT -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — 2AM</title>
<!-- Added 2026-09-08, rotation 1 branding audit, item #10: this page had no
     favicon/description/robots tag at all. noindex because it's a private
     per-order page rendered entirely from sessionStorage — nothing here is
     meant to be a public, indexable, or shareable URL. -->
<meta name="robots" content="noindex">
<meta name="description" content="Your 2AM order confirmation.">
<meta name="theme-color" content="#f4ede0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%23f4ede0%27/%3E%3Ccircle cx=%2744%27 cy=%2752%27 r=%2726%27 fill=%27%232e4a35%27/%3E%3Ccircle cx=%2756%27 cy=%2744%27 r=%2722%27 fill=%27%23f4ede0%27/%3E%3Cpath d=%27M78 20L81 27L88 30L81 33L78 40L75 33L68 30L75 27Z%27 fill=%27%237d612d%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/fonts.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* OLD-MONEY PASS (2026-09-03): this page had its own separate legacy token
       set (never synced to the shared dark-luxury system in the 2026-08-23 pass
       either), so it gets the same cream/ink/brass repaint by hand here, plus
       its purple "WARDROBE" accent harmonized to the plum used site-wide. */
    /* CONTRAST FIX (2026-09-08, rotation 1 branding audit round 2): this page
       keeps its own separate token set instead of importing base.css's, so the
       2026-09-08 item #13 WCAG fix (base.css's --gold/--muted) never reached
       here — this page's own --gold/--muted are real, live order-confirmation
       text (order total, item prices, nav logo, "Return home" link) still at
       the original unfixed values. Real relative-luminance math against this
       page's own #f4ede0 background: --gold at its original #a8894f measured
       2.84:1 (same failure base.css had), darkened to #7d612d (4.98:1) —
       identical fix, same token, just applied here too. --muted at #7a6f5c measured 4.24:1,
       also a real AA fail (barely, but still under 4.5:1); darkened along the
       same hue to #6d6352 (5.07:1). --gold2 is declared but never used as
       text on this page (checked), so it's untouched. */
    --black:#f4ede0; --black2:#ece1c8; --black3:#e7d9ba; --border:#d6c6a0;
    --gold:#7d612d; --gold2:#c2a876; --white:#2a2419; --muted:#6d6352;
    --purple:#6f4e6f; --success:#5c8a5c;
    --font:'EB Garamond',Georgia,'Times New Roman',serif; --mono:'Courier Prime','Courier New',monospace;
  }
  body { font-family:var(--font); background:var(--black); color:var(--white); -webkit-font-smoothing:antialiased; min-height:100vh; }

  nav { display:flex; align-items:center; justify-content:space-between; padding:0 40px; height:64px; background:var(--black); border-bottom:1px solid var(--border); }
  .nav-logo { font-family:var(--mono); font-size:18px; font-weight:700; letter-spacing:.12em; color:var(--white); text-decoration:none; }
  .nav-logo span { color:var(--gold); }

  .page { max-width:680px; margin:0 auto; padding:60px 24px 80px; }

  /* CHECK ANIMATION */
  .check-wrap { display:flex; justify-content:center; margin-bottom:32px; }
  .check-ring {
    width:72px; height:72px; border-radius:50%;
    border:2px solid var(--success);
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
    animation:popIn .4s cubic-bezier(.175,.885,.32,1.275) forwards;
  }
  @keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }

  .confirm-title { text-align:center; font-size:28px; font-weight:700; margin-bottom:8px; }
  .confirm-sub { text-align:center; font-size:14px; color:var(--muted); margin-bottom:40px; }

  /* WARDROBE CODES */
  .codes-section { margin-bottom:32px; }
  .section-label {
    font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted); margin-bottom:14px;
    border-bottom:1px solid var(--border); padding-bottom:10px;
  }
  .code-card {
    background:linear-gradient(135deg, #f2e6ec, #ece0e8);
    border:1px solid rgba(111,74,111,.28); border-radius:14px; padding:20px;
    margin-bottom:12px; position:relative; overflow:hidden;
  }
  .code-card::before {
    content:'⬡'; position:absolute; right:16px; top:16px;
    font-size:40px; color:rgba(111,74,111,.14); pointer-events:none;
  }
  .code-card-product { font-size:14px; font-weight:600; color:var(--white); margin-bottom:4px; }
  .code-card-meta { font-size:11px; color:var(--purple); margin-bottom:14px; }
  .code-display {
    font-family:var(--mono); font-size:18px; font-weight:700;
    color:var(--gold); letter-spacing:.08em;
    background:var(--black2); border:1px solid var(--border);
    border-radius:8px; padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .copy-btn {
    background:none; border:1px solid var(--border); color:var(--muted);
    padding:6px 12px; border-radius:6px; font-family:var(--font); font-size:11px; font-weight:600;
    cursor:pointer; transition:all .2s; letter-spacing:.06em; text-transform:uppercase;
  }
  .copy-btn:hover { border-color:var(--gold); color:var(--gold); }
  .copy-btn.copied { border-color:var(--success); color:var(--success); }
  .wardrobe-instructions {
    margin-top:12px; font-size:11px; color:var(--purple); line-height:1.6;
    background:rgba(111,74,111,.08); border-radius:6px; padding:10px 12px;
  }
  .wardrobe-instructions strong { color:var(--white); }

  /* ORDER SUMMARY */
  .order-summary {
    background:var(--black2); border:1px solid var(--border);
    border-radius:14px; padding:20px; margin-bottom:32px;
  }
  .order-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .order-row:last-child { border-bottom:none; }
  .order-row .label { color:var(--muted); }
  .order-row .value { font-weight:600; }
  .order-row.total .value { font-family:var(--mono); color:var(--gold); font-size:15px; }
  .order-id { font-family:var(--mono); font-size:11px; color:var(--muted); }

  /* ORDER ITEMS */
  .items-list { margin-bottom:32px; }
  .order-item { display:flex; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); }
  .order-item:last-child { border-bottom:none; }
  .order-item-img { width:52px; height:52px; background:var(--black3); border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.06em; color:var(--muted); flex-shrink:0; }
  .order-item-info { flex:1; }
  .order-item-name { font-size:13px; font-weight:600; margin-bottom:3px; }
  .order-item-meta { font-size:11px; color:var(--muted); }
  .order-item-price { font-family:var(--mono); font-size:13px; color:var(--gold); }

  /* ACTIONS */
  .actions { display:flex; gap:12px; }
  .btn-primary { flex:1; padding:14px; background:var(--gold); color:var(--black); border:none; border-radius:8px; font-family:var(--font); font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center; }
  .btn-ghost { flex:1; padding:14px; background:none; border:1px solid var(--border); color:var(--white); border-radius:8px; font-family:var(--font); font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center; transition:all .2s; }
  .btn-ghost:hover { border-color:var(--gold); color:var(--gold); }

  .loading { text-align:center; padding:80px 20px; color:var(--muted); }
  .error { background:rgba(140,47,47,.08); border:1px solid rgba(140,47,47,.3); border-radius:12px; padding:20px; color:var(--red, #8c2f2f); text-align:center; }
  .hidden { display:none; }

  /* PREORDER NOTE */
  .preorder-note { background:var(--black2); border:1px solid var(--border); border-radius:12px; padding:16px 20px; margin-bottom:32px; font-size:13px; color:var(--white); line-height:1.6; }
  .preorder-note strong { color:var(--white); }

  @media (max-width:600px) {
    nav { padding:0 20px; }
    .page { padding:40px 16px 60px; }
    .actions { flex-direction:column; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">2AM<span>.</span></a>
</nav>

<div class="page">
  <div id="loading-state" class="loading">Loading your order...</div>
  <div id="error-state" class="error hidden">Could not load order. <a href="/" style="color:var(--gold)">Return home</a></div>
  <div id="order-content" class="hidden">

    <div class="check-wrap"><div class="check-ring">✓</div></div>
    <h1 class="confirm-title">Order Confirmed</h1>
    <p class="confirm-sub" id="confirm-sub">Your 2AM drop is on its way.</p>

    <!-- WARDROBE CODES — the big feature -->
    <div class="codes-section" id="codes-section"></div>

    <!-- ORDER ITEMS -->
    <div class="section-label">Your Order</div>
    <div class="items-list" id="items-list"></div>

    <!-- ORDER SUMMARY -->
    <div class="order-summary">
      <div class="order-row"><span class="label">Order ID</span><span class="order-id" id="order-id-display">—</span></div>
      <div class="order-row"><span class="label">Email</span><span class="value" id="order-email">—</span></div>
      <div class="order-row"><span class="label">Payment</span><span class="value" style="color:var(--success)">Confirmed ✓</span></div>
      <div class="order-row total"><span class="label">Total</span><span class="value" id="order-total">—</span></div>
    </div>

    <!-- PREORDER NOTE -->
    <div class="preorder-note hidden" id="preorder-note"></div>

    <!-- ACTIONS -->
    <div class="actions">
      <a href="/catalog.html" class="btn-ghost">Keep Shopping</a>
      <a href="#" class="btn-primary" id="open-wardrobe-btn" onclick="openWardrobeDeeplink()">Open WARDROBE App</a>
    </div>

  </div>
</div>

<!-- Added 2026-09-08, rotation 1 branding audit, item #10: this page had no
     footer at all — one click and a customer had no way back to Privacy/
     Terms/Contact from their own confirmation page. Styled inline with this
     page's own legacy token set rather than pulling in shared/base.css,
     since this page doesn't load it and a wholesale redesign is out of
     scope for a live checkout page. -->
<footer style="max-width:680px;margin:40px auto 0;padding:20px 24px 40px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--muted)">
  <a href="/privacy.html" style="color:var(--muted);text-decoration:underline;margin:0 10px">Privacy</a>
  <a href="/terms.html" style="color:var(--muted);text-decoration:underline;margin:0 10px">Terms</a>
  <a href="mailto:chrisclm713@gmail.com" style="color:var(--muted);text-decoration:underline;margin:0 10px">Contact</a>
</footer>

<script>
  // Order data arrives via sessionStorage, stashed by shared/checkout.js right
  // before it navigates here — Square's Web Payments flow charges the card
  // synchronously in our own /api/payment response, so there's no Stripe-style
  // "session_id" to look up server-side after the fact.
  // Rotation 1 branding audit, item #33 (no emoji icons): this used to be
  // colorful clothing pictographs. Swapped for short mono-ledger text labels,
  // consistent with base.css's --mono ("Courier Prime — a heritage ledger
  // typewriter face") already used for prices/codes/badges sitewide.
  const EMOJIS = { tee:'TEE', hoodie:'HOOD', bottoms:'BTM', headwear:'CAP', shorts:'SHRT' };

  // Same escaping as shared/cart.js: this page rebuilds the order from stored
  // data with innerHTML, and product names/notes/codes shouldn't be trusted
  // raw. Moved to top-level scope 2026-09-03 — it used to be declared inside
  // renderOrder() (still worked there via hoisting, but was out of scope for
  // renderCodes()), and renderCodes() was interpolating entry.code and
  // entry.product?.name straight into innerHTML with no escaping at all —
  // the one spot on this page that skipped the rule the rest of the file
  // (and shared/cart.js's own comment, which literally calls out "the
  // confirmation page" as a place this exact class of bug reaches) applies
  // everywhere else.
  function escHtml(v) {
    return String(v ?? '').replace(/[&<>"']/g, (ch) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ));
  }

  function loadOrder() {
    const raw = sessionStorage.getItem('2am_order');
    if (!raw) { renderFallback(); return; }
    sessionStorage.removeItem('2am_order');
    try {
      renderOrder(JSON.parse(raw));
    } catch (err) {
      renderFallback();
    }
  }

  function renderOrder(data) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('order-content').classList.remove('hidden');

    // Only claim an email when the server actually queued one (od.customerEmailed, stashed by
    // shared/checkout.js). Otherwise say what is true: the order is confirmed and this page
    // holds the order ID and any activation codes. (It used to say "Confirmation sent to…"
    // unconditionally, which was false whenever email wasn't working.)
    document.getElementById('confirm-sub').textContent = data.email && data.customerEmailed === true
      ? `Confirmation sent to ${data.email}`
      : 'Your order is confirmed and paid. Keep this page: it has your order ID and any activation codes.';
    document.getElementById('order-id-display').textContent = data.transactionId?.slice(-12) || '—';
    document.getElementById('order-email').textContent      = data.email || '—';
    document.getElementById('order-total').textContent      = data.total ? `$${data.total}` : '—';

    // WARDROBE CODES
    renderCodes(data.wardrobeCodes || []);

    // PREORDER NOTE — present only when this order contained preorder items
    // (a Printify "preorder" tag, or a synthetic hardware product like the
    // Veynor Solis). Those items were intentionally NOT sent to fulfillment.
    const preorderEl = document.getElementById('preorder-note');
    if (data.preorder?.note) {
      preorderEl.classList.remove('hidden');
      preorderEl.innerHTML = `<strong>Preorder:</strong> ${escHtml(data.preorder.note)}. You'll get a separate email when it ships.`;
    } else {
      preorderEl.classList.add('hidden');
    }

    // Items — shaped like shared/cart.js's cart entries: {name, price (dollars), size, color, ...}
    const itemsList = document.getElementById('items-list');
    if (data.items && data.items.length) {
      itemsList.innerHTML = data.items.map(item => `
        <div class="order-item">
          <div class="order-item-img">${EMOJIS[(item.name||'').toLowerCase().includes('hood')?'hoodie':'tee'] || 'TEE'}</div>
          <div class="order-item-info">
            <div class="order-item-name">${escHtml(item.name || 'Item')}</div>
            <div class="order-item-meta">${escHtml([item.size, item.color].filter(Boolean).join(' / ') || 'Qty: 1')}</div>
          </div>
          <div class="order-item-price">$${Number(item.price || 0).toFixed(2)}</div>
        </div>
      `).join('');
    }
  }

  function renderCodes(codes) {
    const section = document.getElementById('codes-section');
    if (!codes || codes.length === 0) {
      // Still show WARDROBE instructions — codes may be processing
      section.innerHTML = `
        <div class="section-label">⬡ WARDROBE Activation</div>
        <div class="code-card">
          <div class="code-card-product">Processing your WARDROBE sync...</div>
          <div class="code-card-meta">Your activation codes will be emailed shortly.</div>
          <div class="wardrobe-instructions">
            <strong>How it works:</strong> Once your code arrives, open WARDROBE → Incoming tab → Enter code. Your exact 2AM piece — color, design, everything — drops straight into your digital closet.
          </div>
        </div>
      `;
      return;
    }

    section.innerHTML = `
      <div class="section-label">⬡ WARDROBE Activation Codes</div>
      ${codes.map((entry, i) => `
        <div class="code-card">
          <div class="code-card-product">${escHtml(entry.product?.name || 'Your 2AM Piece')}</div>
          <div class="code-card-meta">Tap "Add to Closet" in WARDROBE → Incoming tab, then enter this code.</div>
          <div class="code-display">
            <span id="code-text-${i}">${escHtml(entry.code)}</span>
            <button class="copy-btn" id="copy-btn-${i}" onclick="copyCode('${escHtml(entry.code)}', ${i})">Copy</button>
          </div>
          <div class="wardrobe-instructions">
            This code unlocks <strong>${escHtml(entry.product?.name || 'your item')}</strong> — the exact colorway and design — in your WARDROBE closet. Once claimed, it becomes a permanent piece in your digital wardrobe and feeds into outfit generation with 2AM as the anchor.
          </div>
        </div>
      `).join('')}
    `;
  }

  // Shown when this page is reached without order data in sessionStorage —
  // e.g. a bookmark, a page refresh, or the back/forward cache. There's no
  // order to look up (Square's flow has no server-side session to re-fetch),
  // so this stays a generic, still-reassuring confirmation rather than an error.
  function renderFallback() {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('order-content').classList.remove('hidden');
    document.getElementById('confirm-sub').textContent = 'If you just completed checkout, your order went through — check your email for confirmation.';
    document.getElementById('order-id-display').textContent = '—';
    document.getElementById('order-email').textContent      = 'Check your email for confirmation';
    document.getElementById('order-total').textContent      = '—';
    renderCodes([]);
  }

  function copyCode(code, i) {
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.getElementById(`copy-btn-${i}`);
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  // BROKEN LINK FIXED 2026-09-09 (rotation 1, item #32).
  // The fallback used to be 'https://apps.apple.com/app/nightinc-wardrobe',
  // which is not a valid App Store URL — real ones need the numeric app id
  // ('/us/app/<slug>/id<NNNNNNNNN>'). That URL 404s, so anyone who paid,
  // didn't have the app installed, and tapped this button landed on an Apple
  // error page seconds after checkout. Worst possible moment for a dead link.
  //
  // ⚠ CHRIS: this now goes to a search URL, which at least resolves. Per
  // UPDATES.md the only App Store Connect records are Bettermade and
  // carspootz, and neither is publicly released yet — so there is no real
  // WARDROBE app id to point at. Swap SEARCH_URL for the real
  // apps.apple.com/us/app/.../id... link the day it ships. See Q2 in
  // ROTATION-1-AUDIT-20260909.md — the wider "is WARDROBE claimable yet"
  // question is yours to answer, not something to rewrite unilaterally.
  function openWardrobeDeeplink() {
    const SEARCH_URL = 'https://apps.apple.com/search?term=wardrobe%20night%20inc';
    // Deep link to WARDROBE app Incoming tab
    window.location.href = 'wardrobe://incoming';
    // Fallback after 1.5s if the app isn't installed. document.hidden guards
    // the case where the deep link DID work — without it, the app opens and
    // then Safari yanks the user back out to the App Store behind it.
    setTimeout(() => {
      if (document.hidden) return;
      window.location.href = SEARCH_URL;
    }, 1500);
  }

  loadOrder();
</script>
</body>
</html>
